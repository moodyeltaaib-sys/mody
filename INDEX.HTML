<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>go with me</title>
    <link rel="stylesheet" href="stayle.css">
</head>
<body>
    <form action="">
        <h1>prepare your next trip with me ...</h1>
        <p>please take a moment to get in touch i will get back to you shortly</p>
        <div>
            <div>
                <label for="name">full name</label>
                <input type="text" id="name" name="name" required placeholder="Enter you Full Nmae">
            </div>
             <div>
                <label for="the email">Email Adress</label>
                <input type="text" id="the email" name="mail" required placeholder="Enter your Email Adress">
            </div>
             <div>
                <label for="the phone">Phone Number</label>
                <input type="tel" id="the phone" name="phone" required placeholder="Enter you phone Number">
            </div>
            <div>
                <label for="gender">gender</label>
                <div>
                    <input type="radio" name="gender" id="male" value="male">
                    <label class="initial-label" for="male">Male</label>
                </div>
                  <div>
                    <input type="radio" name="gender" id="female" value="female">
                    <label class="initial-label" for="female">female</label>
                </div>
            </div>
            <div>
                <label for="date">Arriving Date</label>
                <input type="date" id="date" name="date">
            </div>
              <div>
                <label for="date">Departure Date>
                <input type="date" id="date" name="date">
              </div>
              <div>
                <label for="file">passport</label>
                <input type="file" name="file" id="file">
              </div>
              <div>
                <label for="cities">where would you like to travel ?</label>
                <select name="cities" id="cities">
                    <option value="">Choose one</option>
                     <option value="cairo">cairo</option>
                      <option value="Alexandria">Alexandria</option>
                       <option value="Luxor">Luxor</option>
                        <option value="Aswan">Aswan</option>
                </select>
              </div>
              <div>
                <label for="">please check on the services that you need</label>
                <div>
                    <input type="checkbox" name="Airline Tickets" id="Airline Tickets">
                    <label for="Airline Tickets" class="inline-label">Airline Tickets</label>
                </div>
                <div>
                    <input type="checkbox" name="Rental car" id="Rental car">
                    <label for="Rental ca" class="inline-label">Rental car</label>
                </div>
                <div>
                    <input type="checkbox" name="Hotel Accomadation" id="Hotel Accomadation">
                    <label for="Hotel Accomadation" class="inline-label">Hotel Accomadation</label>
                </div>
              </div>
        </div>
        <input type="submit" value="submit">
        <input type="reset" value="reset">
    </form>




</body>
</html>
